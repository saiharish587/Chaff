<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manufacturer Profile Setup</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div style="max-width:720px;margin:40px auto;padding:0 16px;">
    <h1>Manufacturer profile setup</h1>
    <p>This project is running in <b>local-only mode</b> (backend removed). Fill this quick form to continue.</p>

    <form id="mfgProfileForm" style="display:flex;flex-direction:column;gap:12px;">
      <input id="businessName" type="text" placeholder="Business name" required />
      <input id="mobile" type="text" placeholder="Mobile" required />
      <input id="city" type="text" placeholder="City" required />
      <input id="pincode" type="text" placeholder="Pincode" required />
      <button type="submit" class="btn btn-primary">Continue to dashboard</button>
    </form>

    <p style="margin-top:18px;"><a href="../index.html">Back to home</a></p>
  </div>

  <script type="module">
    import { getCurrentSession } from '../js/auth.js';

    const STORAGE_KEY = 'chaff.session';

    function writeSession(session) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
    }

    const session = getCurrentSession();
    if (!session || session.role !== 'manufacturer') {
      window.location.href = '../index.html';
    }

    document.getElementById('mfgProfileForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const updated = {
        ...session,
        profileComplete: true,
        manufacturerProfile: {
          businessName: document.getElementById('businessName').value,
          mobile: document.getElementById('mobile').value,
          city: document.getElementById('city').value,
          pincode: document.getElementById('pincode').value,
        }
      };
      writeSession(updated);
      window.location.href = './manufacturer-dashboard.html';
    });
  </script>
</body>
</html>
