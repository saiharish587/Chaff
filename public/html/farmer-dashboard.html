<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="icon" type="image/png" href="../assests/logo_green.png" />
</head>
<body>
  <div style="max-width:900px;margin:40px auto;padding:0 16px;">
    <h1>Farmer Dashboard</h1>
    <p id="welcome"></p>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;">
      <button id="navStubble" class="btn btn-primary">My stubble</button>
      <button id="navOrders" class="btn btn-primary">Orders</button>
      <button id="navProfile" class="btn btn-primary">Profile</button>
      <button id="logout" class="btn btn-secondary">Logout</button>
    </div>

    <section id="sectionStubble">
      <h2>My stubble (mock)</h2>
      <p>No backend connected. This section is a placeholder.</p>
    </section>

    <section id="sectionOrders" style="display:none;">
      <h2>Orders (mock)</h2>
      <p>In local-only mode, orders are not persisted to a server.</p>
    </section>

    <section id="sectionProfile" style="display:none;">
      <h2>Profile</h2>
      <pre id="profileDump" style="background:#f6f6f6;padding:12px;border-radius:8px;overflow:auto;"></pre>
      <p><a href="./farmer_data.html">Edit profile</a></p>
    </section>

    <p style="margin-top:18px;"><a href="../index.html">Back to home</a></p>
  </div>

  <script type="module">
    import { requireRole, logoutUser, getCurrentSession } from '../js/auth.js';

    requireRole(['farmer']);
    const session = getCurrentSession();

    document.getElementById('welcome').textContent = `Welcome, ${session?.name || 'Farmer'}!`;
    document.getElementById('profileDump').textContent = JSON.stringify(session, null, 2);

    const stubble = document.getElementById('sectionStubble');
    const orders = document.getElementById('sectionOrders');
    const profile = document.getElementById('sectionProfile');

    function show(which) {
      stubble.style.display = which === 'stubble' ? 'block' : 'none';
      orders.style.display = which === 'orders' ? 'block' : 'none';
      profile.style.display = which === 'profile' ? 'block' : 'none';
    }

    document.getElementById('navStubble').addEventListener('click', () => show('stubble'));
    document.getElementById('navOrders').addEventListener('click', () => show('orders'));
    document.getElementById('navProfile').addEventListener('click', () => show('profile'));

    document.getElementById('logout').addEventListener('click', logoutUser);
  </script>
</body>
</html>
